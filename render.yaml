# Render Blueprint — Community Recycling Reward System
# Deploy: Dashboard → New → Blueprint → connect this repo

databases:
  - name: ecorewards-db
    plan: free
    databaseName: ecorewards
    user: ecorewards

services:
  - type: web
    name: ecorewards
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:render
    preDeployCommand: npx prisma db push && npx prisma db seed
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecorewards-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        value: https://community-recycling-rewards.onrender.com
      # Set in Render Dashboard → Environment (not committed):
      # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET — Gmail / Google sign-in
      # GEMINI_API_KEY — AI assistant & waste classification
      # GEMINI_CHAT_MODEL=gemini-2.5-flash-lite (optional)
      # GEMINI_VISION_MODEL=gemini-2.5-flash (optional)
